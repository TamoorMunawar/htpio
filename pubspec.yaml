name: htpio
description: "A new Flutter project."
version: 1.0.0+1
homepage: https://github.com/TamoorMunawar/htpio
repository: https://github.com/TamoorMunawar/htpio

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=1.10.0'



dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.htpio
        pluginClass: HtpioPlugin
      ios:
        pluginClass: HtpioPlugin

  uses-material-design: true
